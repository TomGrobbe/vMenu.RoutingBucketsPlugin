name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RESOURCE: vMenu.RoutingBucketsPlugin
  GITVERSION_VERSION: 6.8.2

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install --global GitVersion.Tool --version "$GITVERSION_VERSION"
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet-gitversion /output json | tee gitversion.json

          VERSION=$(jq -er '.MajorMinorPatch' gitversion.json)
          ASSEMBLY=$(jq -er '.AssemblySemVer' gitversion.json)
          FILE=$(jq -er '.AssemblySemFileVer' gitversion.json)

          {
            echo "version=$VERSION"
            echo "assembly=$ASSEMBLY"
            echo "file=$FILE"
            echo "tag=v$VERSION"
            echo "zip=${RESOURCE}-v${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"

      - name: Stamp the manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"

          sed -i "s/^version '[^']*'/version '$VERSION'/" fxmanifest.lua

          grep -q "^version '$VERSION'" fxmanifest.lua || {
            echo "The version line in fxmanifest.lua was not replaced."
            exit 1
          }

      - name: Build
        shell: bash
        run: |
          dotnet build "${RESOURCE}.slnx" -c Release \
            -p:Version="${{ steps.version.outputs.version }}" \
            -p:AssemblyVersion="${{ steps.version.outputs.assembly }}" \
            -p:FileVersion="${{ steps.version.outputs.file }}"

      - name: Check the manifest lists every client assembly
        shell: bash
        run: |
          set -euo pipefail

          sed -n '/^files {/,/^}/p' fxmanifest.lua \
            | grep -o "client/[A-Za-z0-9._]*\.dll" | sed 's|client/||' | sort > declared.txt

          ls "build/${RESOURCE}/client/"*.dll | xargs -n1 basename \
            | grep -v "^${RESOURCE}.Client.dll$" | sort > built.txt

          if ! diff declared.txt built.txt; then
            echo "fxmanifest.lua does not match what the build produced."
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          cd build
          zip -r "../${{ steps.version.outputs.zip }}" "$RESOURCE"
          cd ..

          unzip -l "${{ steps.version.outputs.zip }}"

      - name: Generate changelog
        shell: bash
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep '^v' | head -n 1 || true)

          if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG..HEAD" --pretty=format:'- `%h` (%an) %s' > changelog.txt
          else
            git log --pretty=format:'- `%h` (%an) %s' > changelog.txt
          fi

          echo "Changelog since: ${LAST_TAG:-<beginning>}"
          cat changelog.txt

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          {
            echo "Drop the \`${RESOURCE}\` folder from the zip into your server's resources, then \`ensure ${RESOURCE}\`."
            echo ""
            echo "Needs vMenu Enhanced. The plugin API packages this is built against are pinned in \`Directory.Packages.props\`, so keep them in step with the vMenu your server runs."
            echo ""
            echo "### Changes"
            echo ""
            cat changelog.txt
          } > release_notes.md

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "vMenu Routing Buckets v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md \
            --latest \
            --target "$GITHUB_SHA" \
            "${{ steps.version.outputs.zip }}"
