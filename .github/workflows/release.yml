name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RESOURCE: vMenu.RoutingBucketsPlugin

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Work out the version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.majorMinorPatch }}
        run: |
          npm ci
          npm run build

      - name: Check the manifest version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.majorMinorPatch }}
        run: |
          grep -q "^version '$VERSION'" "build/${RESOURCE}/fxmanifest.lua" || {
            echo "The version line in fxmanifest.lua was not replaced."
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          (cd build && zip -q -r -X "../${RESOURCE}.zip" "$RESOURCE")

          unzip -l "${RESOURCE}.zip"

      - name: Generate changelog
        shell: bash
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep '^v' | head -n 1 || true)

          if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG..HEAD" --pretty=format:'- `%h` (%an) %s' > changelog.txt
          else
            git log --pretty=format:'- `%h` (%an) %s' > changelog.txt
          fi

          echo "Changelog since: ${LAST_TAG:-<beginning>}"
          cat changelog.txt

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.majorMinorPatch }}
        run: |
          set -euo pipefail

          VMENU_VERSION=$(node -p "require('./package.json').dependencies['@vespura/vmenu-plugin']")

          if [ -z "$VMENU_VERSION" ] || [ "$VMENU_VERSION" = "undefined" ]; then
            echo "Could not read the @vespura/vmenu-plugin version from package.json."
            exit 1
          fi

          {
            echo "Made for version \`${VMENU_VERSION}\` of vMenu Enhanced. Usage of other vMenu versions may work but is at your own risk."
            echo ""
            echo "### Changes"
            echo ""
            cat changelog.txt
          } > release_notes.md

          gh release create "v$VERSION" \
            --title "vMenu Routing Buckets v$VERSION" \
            --notes-file release_notes.md \
            --latest \
            --target "$GITHUB_SHA" \
            "${RESOURCE}.zip"
